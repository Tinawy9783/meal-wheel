<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>今日食咩好</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f7f4ee" />
<style>
:root{
  --bg:#f7f4ee;
  --ink:#1f1f22;
  --sub:#7a7268;
  --line:rgba(31,31,34,.08);
  --card:rgba(255,255,255,.65);
  --card-soft:rgba(255,255,255,.60);
  --red:#e8503a;
  --red-dark:#cf3d28;
  --shadow:0 12px 34px rgba(90,70,50,.12);
  --shadow-small:0 3px 12px rgba(90,70,50,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang HK","Microsoft JhengHei",sans-serif;
  color:var(--ink);
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 20% 15%, rgba(246,234,214,.6), transparent 30%),
    radial-gradient(circle at 85% 30%, rgba(227,236,217,.5), transparent 30%),
    radial-gradient(circle at 50% 95%, rgba(243,217,214,.4), transparent 32%),
    linear-gradient(180deg,#faf7f2 0%,#f4f0e9 100%);
  background-attachment:fixed;
  min-height:100vh;
  padding:0 16px 104px;
  line-height:1.6;
  letter-spacing:.01em;
  position:relative;
  overflow-x:hidden;
}

/* 背景食材／水果／飲品裝飾（錯落分佈，唔對稱） */
.deco{position:absolute;z-index:0;pointer-events:none;opacity:.14;line-height:1;}
.deco.d1{top:6%;  left:7%;  font-size:52px;opacity:.14;transform:rotate(-12deg);}
.deco.d2{top:15%; right:9%; font-size:46px;opacity:.16;transform:rotate(10deg);}
.deco.d3{top:31%; left:4%;  font-size:58px;opacity:.12;transform:rotate(8deg);}
.deco.d4{bottom:31%; right:6%;font-size:50px;opacity:.15;transform:rotate(-8deg);}
.deco.d5{bottom:12%; left:11%;font-size:44px;opacity:.16;transform:rotate(14deg);}
.deco.d6{top:56%; right:11%;font-size:40px;opacity:.13;transform:rotate(-10deg);}
.deco.d7{top:23%; left:38%;font-size:36px;opacity:.11;transform:rotate(6deg);}
.deco.d8{bottom:39%; left:23%;font-size:42px;opacity:.13;transform:rotate(-14deg);}
.deco.d9{top:71%; left:5%;  font-size:46px;opacity:.12;transform:rotate(10deg);}
.deco.d10{top:9%; left:55%; font-size:38px;opacity:.12;transform:rotate(-6deg);}

.wrap{max-width:640px;margin:0 auto;position:relative;z-index:1;}

/* 首屏：一屏放齊 標題＋轉盤＋結果＋按鈕，唔使下拉 */
.screen{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0);
  padding-bottom:96px;
}

/* 標題 */
header{text-align:center;margin:10px 0 4px;}
h1{font-size:30px;font-weight:800;letter-spacing:.01em;line-height:1.15;}
.sub{font-size:15px;color:var(--sub);margin-top:4px;}
.clock{display:block;margin-top:4px;font-size:13px;color:var(--sub);}

/* 轉盤 */
.wheel-section{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:8px 0;min-height:0;}
.wheel-wrap{position:relative;width:min(88vw,62vh);height:min(88vw,62vh);}
.pointer{
  width:0;height:0;
  border-left:13px solid transparent;border-right:13px solid transparent;
  border-top:28px solid var(--red);
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:20;
  filter:drop-shadow(0 4px 8px rgba(232,80,58,.3));
}
#wheel{width:100%;height:100%;transition:transform 3.8s cubic-bezier(.2,.8,.2,1);}

/* 甜品切換按鈕（轉盤右上角） */
.dessert-switch{
  position:absolute;top:6px;right:6px;z-index:25;
  border:none;border-radius:14px;padding:8px 12px;
  font-size:14px;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.82);
  color:var(--red-dark);
  border:1px solid rgba(232,80,58,.22);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 12px rgba(90,70,50,.10);
  transition:all .2s ease;
  display:flex;align-items:center;gap:4px;
}
.dessert-switch:active{transform:scale(.95);}
.dessert-switch.active{
  background:linear-gradient(180deg,#ef5c44,var(--red-dark));
  color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(232,80,58,.32);
}

/* 結果卡片 */
.result-box{
  width:100%;
  background:var(--card);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  border:1px solid rgba(255,255,255,.7);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:16px 18px;
  text-align:center;
  min-height:78px;
  display:flex;flex-direction:column;justify-content:center;gap:6px;
}
.result{font-size:21px;font-weight:800;}
.result-note{font-size:15px;color:var(--sub);}

/* 按鈕：固定喺手機底部，捲動都唔移位 */
.btn-row{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;justify-content:center;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));
  background:linear-gradient(180deg, rgba(247,244,238,0), rgba(247,244,238,.92) 35%);
}
.btn{
  border:none;border-radius:22px;padding:15px 30px;font-size:18px;font-weight:700;cursor:pointer;
  transition:all .2s ease;min-width:200px;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(180deg,#ef5c44,var(--red-dark));color:#fff;
  box-shadow:0 10px 26px rgba(232,80,58,.32);
}
.btn-secondary{
  background:rgba(255,255,255,.8);color:var(--ink);
  border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:18px;padding:14px 20px;font-size:16px;
}
.lock-tip{text-align:center;font-size:15px;color:var(--sub);margin-top:16px;}

/* 管理區 */
.manage{
  margin-top:30px;
  background:var(--card);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  border:1px solid rgba(255,255,255,.7);
  border-radius:26px;box-shadow:var(--shadow-small);
  padding:24px;
}
.manage h3{font-size:21px;font-weight:700;margin-bottom:16px;}
.field{width:100%;}
input,textarea,select{
  background:rgba(255,255,255,.78);border:1px solid var(--line);
  border-radius:16px;padding:15px 16px;font-size:17px;color:var(--ink);
  font-family:inherit;margin-bottom:12px;width:100%;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(232,80,58,.4);background:rgba(255,255,255,.92);}
textarea{resize:vertical;}
.add-btn{width:100%;margin-bottom:18px;}

.list{display:flex;flex-direction:column;gap:10px;max-height:300px;overflow-y:auto;padding-right:4px;}
.item{
  background:rgba(255,255,255,.65);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:18px;padding:15px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;
}
.item .meta{flex:1;min-width:0;}
.item .name{font-size:18px;font-weight:600;}
.item .note{font-size:15px;color:var(--sub);margin-top:3px;word-break:break-word;}
.del{border:none;background:transparent;color:#8e8e93;font-size:15px;cursor:pointer;padding:6px 10px;border-radius:10px;}
.del:active{color:#c93434;background:#fbeaea;}

.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.08),transparent);margin:20px 0;}
.rules{font-size:15px;color:var(--sub);}
.rules b{color:var(--ink);}
.rules ul{list-style:disc inside;margin-top:6px;display:flex;flex-direction:column;gap:5px;}

footer{text-align:center;font-size:14px;color:var(--sub);margin-top:28px;}

@keyframes pop{0%{transform:scale(.96);opacity:0;}100%{transform:scale(1);opacity:1;}}
.pop-in{animation:pop .35s cubic-bezier(.22,1,.36,1) both;}

/* 彩帶特效 */
.confetti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:confetti-fall linear forwards;}
@keyframes confetti-fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(105vh) rotate(720deg);opacity:.7;}
}

@media(max-width:560px){
  h1{font-size:27px;}
  .sub{font-size:14px;}
  .result{font-size:19px;}
  .btn{min-width:100%;}
}
</style>
</head>
<body>

<span class="deco d1">🍎</span>
<span class="deco d2">☕</span>
<span class="deco d3">🍞</span>
<span class="deco d4">🍇</span>
<span class="deco d5">🥤</span>
<span class="deco d6">🍓</span>
<span class="deco d7">🍊</span>
<span class="deco d8">🥨</span>
<span class="deco d9">🍹</span>
<span class="deco d10">🍰</span>

<div class="wrap">

  <div class="screen">
  <header>
    <p class="sub">今日唔使諗，轉盤幫你話事</p>
    <span class="clock" id="clock"></span>
  </header>

  <section class="wheel-section">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <svg id="wheel" viewBox="0 0 100 100"></svg>
      <button class="dessert-switch" id="dessertBtn" title="切換到甜品轉盤">🍰 甜品</button>
    </div>
  </section>

  <div class="result-box">
    <div class="result" id="result">仲未轉，仲未餓住</div>
    <div class="result-note" id="resultNote"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="spinBtn">轉一轉</button>
  </div>
  <p class="lock-tip" id="lockTip"></p>
  </div>

  <section class="manage">
    <h3>📝 餐單管理</h3>
    <select id="addPeriod" class="field"></select>
    <input id="foodName" type="text" placeholder="食物名稱，例如：菠蘿油、叉蛋飯" />
    <textarea id="foodNote" rows="2" placeholder="備註：走甜、少冰、記得加菜……"></textarea>
    <button class="btn btn-secondary add-btn" id="addBtn">➕ 加落餐單</button>

    <div class="list" id="listBox"></div>

    <div class="divider"></div>
    <div class="rules">
      <b>時間規則</b>
      <ul>
        <li>早餐 04:00–10:00</li>
        <li>午餐 / 晚餐共用清單｜午餐 10:00–15:00｜晚餐 17:00–22:00</li>
        <li>下午茶 15:00–17:00</li>
        <li>甜品 隨時都得</li>
      </ul>
    </div>
  </section>

  <footer>資料只存在你部手機，唔會上傳出去。</footer>
</div>

<script>
const STORE_KEY = "hk_meal_wheel_v6";

const PERIODS = [
  { key:"breakfast", name:"早餐",   startMin:4*60,    endMin:10*60,  desc:"04:00–10:00" },
  { key:"lunch",     name:"午餐",   startMin:10*60,  endMin:15*60,  desc:"10:00–15:00", share:"main" },
  { key:"tea",       name:"下午茶", startMin:15*60,  endMin:17*60,  desc:"15:00–17:00" },
  { key:"dinner",    name:"晚餐",   startMin:17*60,  endMin:22*60,  desc:"17:00–22:00", share:"main" },
];
const DESSERT_KEY = "dessert";
const SHARE_MAIN = "main";

/* 轉盤格柔和配色（循環用） */
const PALETTE = ["#f6ead6","#ececed","#e3ecd9","#f3d9d6","#eef0f2","#e8e4f0"];

const defaultData = {
  breakfast:{ list:[
    {name:"菠蘿油",note:"配熱奶茶，走甜少少。"},
    {name:"豬油撈麵",note:"記得叫走韭黃。"},
    {name:"叉燒包＋豆漿",note:"早餐經典，唔會錯。"},
    {name:"炒蛋多士",note:"要滑蛋，唔係煎蛋。"} ]},
  [SHARE_MAIN]:{ list:[
    {name:"番茄雞蛋通粉",note:"湯底要濃，通粉彈牙。"},
    {name:"生菜牛肉湯飯",note:"牛肉要嫩，生菜爽口。"},
    {name:"生蠔生菜拉麵",note:"生蠔新鮮，湯底清甜。"},
    {name:"薄荷瘦肉湯",note:"薄荷清涼，瘦肉入味。"} ]},
  tea:{ list:[
    {name:"西多士",note:"少糖少牛油，當減肥。"},
    {name:"魚蛋粉",note:"魚蛋彈牙，湯要清。"},
    {name:"格仔餅",note:"花生醬味，經典中之經典。"},
    {name:"凍檸茶＋菠蘿包",note:"少冰，唔好太甜。"} ]},
  dessert:{ list:[
    {name:"楊枝甘露",note:"芒果要甜，西柚唔好太苦。"},
    {name:"芒果糯米糍",note:"皮要薄，餡要足。"},
    {name:"芝麻湯圓",note:"熱熱地，最適合凍天。"},
    {name:"榴槤班戟",note:"鍾意榴槤先好揀。"} ]}
};

let data = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
if(!data){
  const old = JSON.parse(localStorage.getItem("hk_meal_wheel_v5") || "null")
           || JSON.parse(localStorage.getItem("hk_meal_wheel_v4") || "null")
           || JSON.parse(localStorage.getItem("hk_meal_wheel_v3") || "null");
  if(old){
    data = JSON.parse(JSON.stringify(defaultData));
    data.breakfast = old.breakfast ?? defaultData.breakfast;
    data.tea = old.tea ?? defaultData.tea;
    data.dessert = old.dessert ?? defaultData.dessert;
    const mergeList = [...(old[SHARE_MAIN]?.list ?? []), ...(old.lunch?.list ?? []), ...(old.dinner?.list ?? [])];
    data[SHARE_MAIN].list = mergeList.length ? mergeList : defaultData[SHARE_MAIN].list;
  }else{
    data = JSON.parse(JSON.stringify(defaultData));
  }
}
/* 結構防禦：確保每個分組都係 {list:[]}，避免舊資料污染導致報錯 */
["breakfast",SHARE_MAIN,"tea",DESSERT_KEY].forEach(k=>{
  if(!data[k] || !Array.isArray(data[k].list)){
    data[k] = { list: Array.isArray(data[k]) ? data[k] : [] };
  }
});
let rotateDeg = 0;
let forceDessert = false; // 手動切換甜品模式

const $ = id => document.getElementById(id);
const wheel=$("wheel"), result=$("result"), resultNote=$("resultNote"), listBox=$("listBox");
const foodName=$("foodName"), foodNote=$("foodNote"), lockTip=$("lockTip"), clockEl=$("clock");
const dessertBtn=$("dessertBtn");

function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function inPeriod(p){ const m=nowMin(); return p.wrap ? (m>=p.startMin||m<p.endMin) : (m>=p.startMin&&m<p.endMin); }
function activePeriod(){ return PERIODS.find(inPeriod)||null; }
function periodName(k){
  if(k==="lunch"||k==="dinner"||k===SHARE_MAIN) return "午/晚餐";
  if(k===DESSERT_KEY) return "甜品";
  const all=[...PERIODS,{key:DESSERT_KEY,name:"甜品"}];
  return (all.find(x=>x.key===k)||{}).name || k;
}
function getDataKey(tabKey){
  const p = PERIODS.find(x=>x.key === tabKey);
  return p?.share || tabKey;
}

function renderClock(){
  const t=new Date().toLocaleTimeString("zh-HK",{hour12:false});
  const act=activePeriod();
  let tip = act?periodName(act.key):"甜品";
  if(forceDessert) tip = "甜品（手動）";
  clockEl.textContent=`而家時間：${t}　｜　啱食：${tip}`;
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* 而家時段可抽嘅餐單；手動甜品優先 */
function candidate(){
  if(forceDessert){
    return {key:DESSERT_KEY, list:data[DESSERT_KEY].list, pkey:DESSERT_KEY};
  }
  const act=activePeriod();
  let pkey=act?act.key:"lunch";
  let key=getDataKey(pkey);
  let list=data[key].list;
  if(!list.length){key=SHARE_MAIN;list=data[SHARE_MAIN].list;}
  if(!list.length){key=DESSERT_KEY;list=data[DESSERT_KEY].list;}
  return {key,list,pkey};
}

/* 轉盤：每格一道菜，格內顯示菜名 */
function drawWheel(items){
  const N=items.length;
  let out=`<circle cx="50" cy="50" r="48" fill="rgba(255,255,255,.55)" stroke="#e6e2da" stroke-width="0.6"/>`;
  if(N>0){
    const per=360/N;
    items.forEach((it,i)=>{
      const a1=per*i*Math.PI/180, a2=per*(i+1)*Math.PI/180;
      out+=`<path d="M50,50 L${(50+47*Math.cos(a1)).toFixed(2)},${(50+47*Math.sin(a1)).toFixed(2)} A47,47 0 0,1 ${(50+47*Math.cos(a2)).toFixed(2)},${(50+47*Math.sin(a2)).toFixed(2)} Z" fill="${PALETTE[i%PALETTE.length]}" fill-opacity="0.65" stroke="#fff" stroke-width="0.8"/>`;
      const deg=per*(i+0.5);
      const rad=deg*Math.PI/180;
      const flip=deg>90&&deg<270;
      const rot=flip?deg+180:deg;
      const tx=50+28*Math.cos(rad), ty=50+28*Math.sin(rad);
      const fs=N<=3?4.6:N<=6?3.8:3.2;
      const label=it.name.length>5?it.name.slice(0,5)+"…":it.name;
      out+=`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" transform="rotate(${rot.toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)})" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" fill="#2b2b2e" font-weight="700">${esc(label)}</text>`;
    });
  }
  out+=`<circle cx="50" cy="50" r="9" fill="rgba(255,255,255,.85)" stroke="#e6e2da" stroke-width="0.6"/>`;
  wheel.innerHTML=out;
}

function refreshWheel(){ const {list}=candidate(); drawWheel(list); }

function renderList(){
  listBox.innerHTML="";
  const groups=[
    {key:"breakfast",name:"早餐"},
    {key:SHARE_MAIN,name:"午/晚餐"},
    {key:"tea",name:"下午茶"},
    {key:DESSERT_KEY,name:"甜品"}
  ];
  groups.forEach(g=>{
    data[g.key].list.forEach((it,i)=>{
      const row=document.createElement("div");
      row.className="item";
      row.innerHTML=`<div class="meta"><div class="name">【${g.name}】${esc(it.name)}</div>${it.note?`<div class="note">${esc(it.note)}</div>`:""}</div>`;
      const del=document.createElement("button");
      del.className="del"; del.textContent="刪除";
      del.onclick=()=>{data[g.key].list.splice(i,1);save();renderList();};
      row.appendChild(del);
      listBox.appendChild(row);
    });
  });
  if(!listBox.innerHTML) listBox.innerHTML=`<div class="rules">暫無食物，喺上面新增啦。</div>`;
  refreshWheel();
}

function confetti(){
  const colors=["#e8503a","#2b69d8","#e3ecd9","#f6ead6","#f3d9d6","#eef0f2","#f7c948"];
  const total=42;
  for(let i=0;i<total;i++){
    const p=document.createElement("div");
    p.className="confetti";
    p.style.left=(10+Math.random()*80)+"%";
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*0.25)+"s";
    p.style.animationDuration=(1.6+Math.random()*1.2)+"s";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),3400);
  }
}

function spin(){
  const {list,pkey}=candidate();
  if(!list.length){
    result.textContent="餐單空咗，先加幾樣啦";
    resultNote.textContent="";
    return;
  }
  const idx=Math.floor(Math.random()*list.length);
  const N=list.length, per=360/N;
  const c=per*(idx+0.5);
  const targetMod=((-90-c)%360+360)%360;
  const old=rotateDeg;
  rotateDeg=old-(old%360)+360*5+targetMod;
  if(rotateDeg<=old) rotateDeg+=360;
  wheel.style.transform=`rotate(${rotateDeg}deg)`;

  setTimeout(()=>{
    const pick=list[idx];
    result.classList.remove("pop-in");void result.offsetWidth;
    result.textContent=`${periodName(pkey)}：${pick.name}`;
    resultNote.textContent=pick.note||"廚師話：隨便啦，都好食。";
    result.classList.add("pop-in");
    lockTip.textContent="";
    confetti();
  },3900);
}

/* 甜品切換按鈕 */
function toggleDessert(){
  forceDessert = !forceDessert;
  dessertBtn.classList.toggle("active", forceDessert);
  dessertBtn.textContent = forceDessert ? "🍰 甜品中" : "🍰 甜品";
  result.textContent = forceDessert ? "已切換到甜品轉盤" : "仲未轉，仲未餓住";
  resultNote.textContent = forceDessert ? "撳「轉一轉」就喺甜品入面抽！" : "";
  refreshWheel();
  renderClock();
}

function setupManage(){
  const sel=$("addPeriod");
  const optList=[
    {key:"breakfast",name:"早餐"},
    {key:SHARE_MAIN,name:"午/晚餐"},
    {key:"tea",name:"下午茶"},
    {key:DESSERT_KEY,name:"甜品"}
  ];
  optList.forEach(o=>{
    const op=document.createElement("option");
    op.value=o.key;op.textContent=o.name;sel.appendChild(op);
  });
  $("addBtn").onclick=()=>{
    const name=foodName.value.trim(), note=foodNote.value.trim(), key=sel.value;
    if(!name){alert("餐名都唔寫，不如吃空氣？");return;}
    data[key].list.push({name,note}); save(); renderList();
    foodName.value=""; foodNote.value="";
  };
}

$("spinBtn").onclick=spin;
dessertBtn.onclick=toggleDessert;

refreshWheel();
renderList();
renderClock();
setupManage();
setInterval(renderClock,1000);
</script>
</body>
</html>
