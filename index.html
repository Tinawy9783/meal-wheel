<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>今日食咩好</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f8f6f2" />
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;
  overflow-x:hidden;
  touch-action:pan-y;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif;
  background:#f8f6f2;
  background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30,20 C35,15 42,18 40,25 C38,32 30,33 28,26 Z' fill='%23e9e4dd' fill-opacity='0.4'/%3E%3Ccircle cx='90' cy='80' r='12' fill='%23e9e4dd' fill-opacity='0.35'/%3E%3Cpath d='M70,30 L75,45 L65,45 Z' fill='%23e9e4dd' fill-opacity='0.35'/%3E%3C/svg%3E");
  padding:24px 16px 110px;
  min-height:100vh;
  max-width:100vw;
}
.food-deco{
  position:fixed;
  z-index:0;
  pointer-events:none;
  opacity:0.24;
}
.deco1{top:28px;left:22px;width:52px;transform:rotate(-12deg);}
.deco2{top:50px;right:26px;width:44px;transform:rotate(8deg);}
.deco3{top:32%;left:8px;width:48px;transform:rotate(-6deg);}
.deco4{top:42%;right:14px;width:38px;transform:rotate(15deg);}
.deco5{bottom:140px;left:16px;width:54px;transform:rotate(-18deg);}
.deco6{bottom:220px;right:22px;width:42px;transform:rotate(10deg);}
.deco7{top:65%;left:12px;width:36px;transform:rotate(5deg);}
.deco8{top:72%;right:8px;width:46px;transform:rotate(-10deg);}
.deco9{bottom:320px;left:30%;width:40px;transform:rotate(7deg);}
.deco10{bottom:360px;right:30%;width:35px;transform:rotate(-14deg);}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;}
header{text-align:center;margin-bottom:24px;}
.subtitle{font-size:22px;color:#333;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;justify-content:center;}
.tab-btn{
  border:none;background:rgba(255,255,255,0.65);backdrop-filter:blur(10px);
  padding:10px 14px;border-radius:999px;font-size:17px;color:#333;
}
.tab-active{background:#2b69d8;color:#fff;}
.wheel-box{
  position:relative;
  width:min(94vw,420px);
  height:min(94vw,420px);
  margin:20px auto 28px;
  overflow:hidden;
}
.dessert-corner-btn{
  position:absolute;
  top:-12px;
  right:-8px;
  z-index:12;
  border:none;background:rgba(255,255,255,0.65);backdrop-filter:blur(10px);
  padding:8px 12px;border-radius:999px;font-size:16px;color:#333;
}
.dessert-corner-btn.active{background:#2b69d8;color:#fff;}
.pointer{
  width:0;height:0;
  border-left:14px solid transparent;border-right:14px solid transparent;
  border-top:30px solid #2b69d8;
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:10;
  filter:drop-shadow(0 4px 7px rgba(0,0,0,.18));
}
#wheel{
  width:100%;
  height:100%;
  transition:transform 3.6s cubic-bezier(.2,0.8,.2,1);
  transform-origin:center center;
}
.result-card{
  background:rgba(255,255,255,0.65);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:24px;padding:26px 22px;margin-bottom:26px;
  border:1px solid rgba(255,255,255,0.85);
}
.result-title{font-size:42px;font-weight:800;color:#1c1c1c;margin-bottom:8px;line-height:1.15;}
.result-note{font-size:20px;color:#444;}
.spin-btn{
  position:fixed;
  left:16px;right:16px;
  bottom:max(22px,env(safe-area-inset-bottom));
  z-index:99;
  border:none;border-radius:999px;padding:20px 0;font-size:28px;font-weight:700;
  background:#2b69d8;color:#fff;box-shadow:0 8px 20px rgba(43,105,216,0.24);
  transition:0.2s;cursor:pointer;
}
.spin-btn:active{transform:scale(0.97);box-shadow:0 4px 10px rgba(43,105,216,0.2);}
.manage{
  background:rgba(255,255,255,0.65);backdrop-filter:blur(16px);
  border-radius:24px;padding:22px;margin-top:24px;border:1px solid rgba(255,255,255,0.85);
}
.manage h3{font-size:22px;margin-bottom:14px;color:#222;}
input,textarea,select{
  width:100%;padding:14px;border-radius:16px;border:1px solid #ddd;
  font-size:18px;margin-bottom:12px;background:rgba(255,255,255,0.85);
}
.add-btn{width:100%;padding:14px;border-radius:16px;border:none;background:#4488ee;color:#fff;font-size:18px;margin-bottom:16px;}
.list{display:flex;flex-direction:column;gap:10px;max-height:260px;overflow-y:auto;}
.item{background:rgba(255,255,255,0.65);padding:14px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;}
.item-name{font-size:18px;}
.del{border:none;background:transparent;color:#c83c3c;font-size:16px;}
.confetti{
  position:fixed;
  width:10px;height:10px;
  top:-10px;
  z-index:100;
  border-radius:2px;
  animation:fall 2.8s linear forwards;
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0;}
}
</style>
</head>
<body>
<div class="food-deco deco1">🍎</div>
<div class="food-deco deco2">🍇</div>
<div class="food-deco deco3">🍞</div>
<div class="food-deco deco4">☕</div>
<div class="food-deco deco5">🍓</div>
<div class="food-deco deco6">🥤</div>
<div class="food-deco deco7">🥨</div>
<div class="food-deco deco8">🍊</div>
<div class="food-deco deco9">🍰</div>
<div class="food-deco deco10">🍹</div>

<div class="wrap">
  <header>
    <div class="subtitle">選擇困難症救星，轉盤幫你揀食咩</div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="wheel-box">
    <button class="dessert-corner-btn" id="dessertCornerBtn">甜品</button>
    <div class="pointer"></div>
    <svg id="wheel" viewBox="0 0 100 100"></svg>
  </div>

  <div class="result-card">
    <div class="result-title" id="result">等轉盤發話</div>
    <div class="result-note" id="resultNote">撳下面粒掣，聽命於轉盤</div>
  </div>

  <div class="manage">
    <h3>📝 飯單後台（話事權係你）</h3>
    <select id="addPeriod"></select>
    <input id="foodName" placeholder="寫低呢個好嘢嘅名" />
    <textarea id="foodNote" rows="2" placeholder="例如：超正、辣到飛起、清潤舒服"></textarea>
    <button class="add-btn" id="addBtn">➕ 收錄呢個美食</button>
    <div class="list" id="listBox"></div>
  </div>
</div>

<button class="spin-btn" id="spinBtn">轉一轉</button>

<script>
const STORE_KEY = "meal_wheel_v5";
const PERIODS = [
  {key:"breakfast",name:"早餐",startMin:4*60,endMin:10*60},
  {key:"main",name:"午/晚餐",startMin:10*60,endMin:22*60,share:"main"},
  {key:"tea",name:"下午茶",startMin:15*60,endMin:17*60},
];
const DESSERT_KEY = "dessert";
const SHARE_MAIN = "main";
const COLORS = ["#f8e9d6aa","#e9ecefaa","#e2f0ddaa","#f7e4e4aa","#e6edf7aa"];
const defaultData = {
  breakfast:{tip:"",list:[]},
  [SHARE_MAIN]:{tip:"",list:[
    {name:"番茄雞蛋通粉",note:"酸甜開胃"},
    {name:"生菜牛肉湯飯",note:"牛肉嫩，湯飯熱"},
    {name:"生蠔生菜拉麵",note:"鮮甜"},
    {name:"薄荷瘦肉湯",note:"清涼解膩"}
  ]},
  tea:{tip:"",list:[]},
  dessert:{tip:"",list:[]}
};
let data = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
if(!data) data = JSON.parse(JSON.stringify(defaultData));
else{
  for(let k in defaultData){
    if(!data[k]) data[k] = JSON.parse(JSON.stringify(defaultData[k]));
    if(!Array.isArray(data[k].list)) data[k].list = [];
  }
}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(data));}
let currentTab = "main";
let rotateDeg = 0;
let targetIndex = 0;
const $ = id=>document.getElementById(id);
const wheel = $("wheel"), result = $("result"), resultNote = $("resultNote");
const foodName = $("foodName"), foodNote = $("foodNote"), listBox = $("listBox");
const addPeriod = $("addPeriod");
const dessertCornerBtn = $("dessertCornerBtn");

function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function activePeriod(){
  const m = nowMin();
  return PERIODS.find(p=> (m>=p.startMin&&m<=p.endMin));
}
function getDataKey(tabKey){
  const p = PERIODS.find(x=>x.key===tabKey);
  return p?.share || tabKey;
}
function renderTabs(){
  const tabs = $("tabs");
  tabs.innerHTML="";
  PERIODS.forEach(p=>{
    const b = document.createElement("button");
    b.className = "tab-btn"+(p.key===currentTab?" tab-active":"");
    b.textContent = p.name;
    b.onclick = ()=>{currentTab=p.key;renderAll();};
    tabs.appendChild(b);
  })
  addPeriod.innerHTML = "";
  const optList = [
    {key:"breakfast",name:"早餐"},
    {key:SHARE_MAIN,name:"午/晚餐共用"},
    {key:"tea",name:"下午茶"},
    {key:DESSERT_KEY,name:"甜品"}
  ];
  optList.forEach(o=>{
    const op=document.createElement("option");
    op.value=o.key;op.textContent=o.name;addPeriod.appendChild(op);
  })
}
function drawWheel(svg,list){
  if(!list.length){
    svg.innerHTML = `<circle cx="50" cy="50" r="44" fill="#eeeeee66" stroke="#ddd"/><text x="50" y="50" text-anchor="middle" font-size="4">暫無菜式</text>`;
    return;
  }
  const count = list.length;
  let html = "";
  const degStep = 360 / count;
  for(let i=0;i<count;i++){
    const a1 = degStep*i -90;
    const a2 = degStep*(i+1)-90;
    const c = COLORS[i%COLORS.length];
    html += `<path d="M50,50 L ${50+44*Math.cos(a1*Math.PI/180)} ${50+44*Math.sin(a1*Math.PI/180)} A44 44 0 0 1 ${50+44*Math.cos(a2*Math.PI/180)} ${50+44*Math.sin(a2*Math.PI/180)} Z" fill="${c}" stroke="#fff" stroke-width="0.6"/>`;
    const mid = (a1+a2)/2;
    const tx = 50 + 28 * Math.cos(mid*Math.PI/180);
    const ty = 50 + 28 * Math.sin(mid*Math.PI/180);
    let rot = mid;
    if(rot>90 && rot<270) rot +=180;
    html += `<text x="${tx}" y="${ty}" text-anchor="middle" font-size="3.1" fill="#222" font-weight="600" transform="rotate(${rot},${tx},${ty})">${list[i].name}</text>`;
  }
  svg.innerHTML = html;
}
function renderAll(){
  renderTabs();
  dessertCornerBtn.className = currentTab === DESSERT_KEY ? "dessert-corner-btn active" : "dessert-corner-btn";
  const dKey = getDataKey(currentTab);
  const list = data[dKey].list;
  drawWheel(wheel,list);
  renderList();
  result.textContent = "等轉盤發話";
  resultNote.textContent = "撳下面粒掣，聽命於轉盤";
}
function renderList(){
  const dKey = getDataKey(currentTab);
  const list = data[dKey].list;
  listBox.innerHTML = "";
  list.forEach((item,idx)=>{
    const div = document.createElement("div");
    div.className="item";
    div.innerHTML = `<span class="item-name">${item.name}</span><button class="del">刪除</button>`;
    div.querySelector(".del").onclick = ()=>{
      list.splice(idx,1);save();renderAll();
    }
    listBox.appendChild(div);
  })
}
dessertCornerBtn.onclick = ()=>{
  currentTab = DESSERT_KEY;
  renderAll();
}
$("addBtn").onclick = ()=>{
  const k = addPeriod.value;
  const n = foodName.value.trim();
  const note = foodNote.value.trim();
  if(!n)return;
  if(!Array.isArray(data[k].list)) data[k].list = [];
  data[k].list.push({name:n,note});
  save();renderAll();
  foodName.value="";foodNote.value="";
}
function createConfetti(){
  const colors = ['#2b69d8','#f25c5c','#ffd24d','#49c779','#986ade'];
  for(let i=0;i<45;i++){
    const c = document.createElement("div");
    c.className="confetti";
    c.style.left = Math.random()*100 + "%";
    c.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay = Math.random()*0.4 + "s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2800);
  }
}
$("spinBtn").onclick = ()=>{
  const dKey = getDataKey(currentTab);
  const list = data[dKey].list;
  if(list.length===0){alert("呢個時段仲冇嘢揀！快啲加啲好嘢入去");return;}
  targetIndex = Math.floor(Math.random()*list.length);
  const degStep = 360 / list.length;
  const targetDeg = 360*6 + (360 - degStep*(targetIndex+0.5));
  rotateDeg += targetDeg;
  wheel.style.transform = `rotate(${rotateDeg}deg)`;
  setTimeout(()=>{
    createConfetti();
    const sel = list[targetIndex];
    let showTitle = currentTab===DESSERT_KEY ? "甜品" : PERIODS.find(p=>p.key===currentTab)?.name;
    result.textContent = `${showTitle}：${sel.name}`;
    resultNote.textContent = sel.note || "今日就揀呢個，唔好反駁！";
  },3600)
}
renderAll();
</script>
</body>
</html>
